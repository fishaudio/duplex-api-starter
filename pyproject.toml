[project]
name = "realtime-agent-starter"
version = "0.1.0"
description = "Reference Drive-Thru Voice Agent using Fish Audio Realtime + Vertex AI Gemini + React/TypeScript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "google-auth>=2.62.2",
    "google-genai>=3.3.0",
    "miniaudio>=1.73",
    "msgpack>=1.2.4",
    "numpy>=2.5.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

