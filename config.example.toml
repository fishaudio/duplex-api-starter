# Copy this file to `config.toml` and fill in your credentials before starting a call:
#   cp config.example.toml config.toml

[server]
port = 8080

[fish_realtime]
# Fish Audio Realtime WebSocket endpoint (`/v1/realtime/converse` or `/v1/realtime/speak`)
endpoint = "wss://api.fish.audio/v1/realtime/converse"

# Authentication scheme:
#   - "bearer" -> sends `Authorization: Bearer <token>` (Production Fish API Key)
#   - "basic"  -> sends `Authorization: Basic base64(<username>:<password>)` (Preview / Gateway Basic Auth)
auth_scheme = "bearer"
token = ""
username = ""
password = ""

# Built-in Live-3 voice name ("Clara", "Nora", "Owen", "Marco", ...) or "ref:<voice_library_id>"
default_voice = "Clara"

[vertex_ai]
# Path to your Google Cloud Service Account JSON file with Vertex AI User permissions
credentials_path = ""
location = "global"
default_model = "gemini-3.5-flash-lite"

# Vertex AI PayGo request tier: "priority" (ON_DEMAND_PRIORITY) or "normal" (ON_DEMAND)
default_tier = "priority"

[ambience]
# Mix McDonald's kitchen & drive-thru speaker ambience on the backend with -10 dB speech ducking
enabled = true
level_db = 0.0
